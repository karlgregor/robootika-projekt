[env:heltec]
platform = espressif32@6.12.0
board = heltec_wifi_kit_32_V3
framework = arduino
monitor_speed = 115200
build_src_filter = +<heltec.cpp>

[env:uno]
platform = renesas-ra@1.8.0
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter = +<uno.cpp>

lib_ldf_mode = deep+
lib_deps =
  adafruit/DHT sensor library@1.4.6
